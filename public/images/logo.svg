<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" fill="none">
  <!-- Retro CRT Monitor Body -->
  <rect x="8" y="6" width="48" height="40" rx="8" fill="#231f1a" stroke="#d4a853" stroke-width="2.5" />
  <!-- Screen Inner -->
  <rect x="14" y="12" width="36" height="25" rx="4" fill="#151210" stroke="#c47a5a" stroke-width="1.5" />
  <!-- Screen Glow/Scanlines effect -->
  <rect x="16" y="14" width="32" height="21" rx="2" fill="#25201b" />
  <!-- Globe Wireframe -->
  <circle cx="30" cy="24.5" r="7" stroke="#d4a853" stroke-width="1.5" stroke-linecap="round" />
  <ellipse cx="30" cy="24.5" rx="3.2" ry="7" stroke="#c47a5a" stroke-width="1.2" />
  <line x1="23" y1="24.5" x2="37" y2="24.5" stroke="#c47a5a" stroke-width="1.2" />
  <!-- Pixel Cursor -->
  <path d="M33 24 L33 32.5 L35.8 29.8 L38.5 33.5 L40.2 32.3 L37.5 28.6 L41 28.6 Z" fill="#f5f0e8" stroke="#151210" stroke-width="0.8" stroke-linejoin="round" />
  <!-- Vents / Power LED -->
  <line x1="14" y1="41" x2="21" y2="41" stroke="#7a7060" stroke-width="1.5" stroke-linecap="round" />
  <circle cx="45" cy="41" r="1.5" fill="#c47a5a" />
  <!-- Stand & Base -->
  <path d="M26 46 L24 53 L40 53 L38 46 Z" fill="#231f1a" stroke="#d4a853" stroke-width="2" stroke-linejoin="round" />
  <line x1="19" y1="55" x2="45" y2="55" stroke="#d4a853" stroke-width="2.5" stroke-linecap="round" />
</svg>
